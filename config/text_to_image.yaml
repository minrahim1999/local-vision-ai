# Text-to-Image Configuration
# Backends are selected automatically at runtime based on platform.

# Override backend selection (optional):
# backend: "flux2"     # Force Apple MLX backend
# backend: "sd15"      # Force Diffusers backend
# If omitted, auto-detects: Apple Silicon → flux2, else → sd15

t2i:
  # ------------------------------------------------------------------
  # Apple Silicon MLX (auto-selected on M1/M2/M3/M4 Macs)
  # ------------------------------------------------------------------
  flux2:
    model_id: "mlx-community/FLUX.2-Klein-4B-4bit"
    default_width: 512
    default_height: 512
    default_steps: 4
    default_guidance_scale: 1.0
    max_width: 1024
    max_height: 1024
    low_ram: true
    mlx_cache_limit_gb: 8.0

  # ------------------------------------------------------------------
  # Diffusers / PyTorch (auto-selected on Windows/Linux/NVIDIA)
  # ------------------------------------------------------------------
  sd15:
    model_id: "stabilityai/stable-diffusion-2-1"
    fallback_model: "runwayml/stable-diffusion-v1-5"
    device: null         # null = auto-detect (cuda > mps > cpu)
    dtype: null          # null = auto-detect
    default_width: 512
    default_height: 512
    default_steps: 20
    default_guidance_scale: 7.0
    max_width: 768
    max_height: 768
    cpu_offload: true
