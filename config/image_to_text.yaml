# Image-to-Text Configuration
# Backends are selected automatically at runtime based on platform.

# Override backend selection (optional):
# backend: "smolvlm"    # Force Apple MLX backend
# backend: "qwen"        # Force Transformers backend
# If omitted, auto-detects: Apple Silicon → smolvlm, else → qwen

i2t:
  # ------------------------------------------------------------------
  # Apple Silicon MLX (auto-selected on M1/M2/M3/M4 Macs)
  # ------------------------------------------------------------------
  smolvlm:
    model_id: "mlx-community/SmolVLM-256M-Instruct-4bit"
    max_tokens: 512
    temperature: 0.2
    top_p: 0.9
    json_retries: 3
    max_file_size_mb: 10
    max_image_pixels: 2_097_152

  # ------------------------------------------------------------------
  # Transformers / PyTorch (auto-selected on Windows/Linux/NVIDIA)
  # ------------------------------------------------------------------
  qwen:
    model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
    fallback_model: "microsoft/Phi-3-vision-128k-instruct"
    device: null         # null = auto-detect (cuda > mps > cpu)
    max_tokens: 512
    temperature: 0.2
    top_p: 0.9
    json_retries: 3
    max_file_size_mb: 10
    max_image_pixels: 2_097_152
