name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # --------------------------------------------------------------------------
  # Metadata
  # --------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get.outputs.tag }}
      version: ${{ steps.get.outputs.version }}
      release_name: ${{ steps.get.outputs.release_name }}
    steps:
      - name: Get version from tag
        id: get
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          RELEASE_NAME="Local Vision AI ${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "Building ${RELEASE_NAME}"

  # --------------------------------------------------------------------------
  # macOS
  # --------------------------------------------------------------------------
  build-macos:
    needs: meta
    runs-on: macos-14
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i '' "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build .app
        run: .venv/bin/pyinstaller app/desktop.spec --clean --noconfirm

      - name: Verify build
        run: |
          test -d dist/LocalVisionAI.app || { echo "Build failed: no .app"; exit 1; }
          ls dist/LocalVisionAI.app/Contents/Resources/assets/icons/ || true

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_staging
          cp -r dist/LocalVisionAI.app dist/dmg_staging/
          hdiutil create -volname "Local Vision AI" \
            -srcfolder dist/dmg_staging \
            -ov -format UDZO \
            "dist/LocalVisionAI-${{ needs.meta.outputs.tag }}-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/LocalVisionAI-*-macOS.dmg
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows
  # --------------------------------------------------------------------------
  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build EXE
        run: .venv\Scripts\pyinstaller app/desktop.spec --clean --noconfirm

      - name: Verify build
        shell: bash
        run: test -d dist/LocalVisionAI/ || { echo "Build failed"; exit 1; }

      - name: Create ZIP
        run: |
          cd dist\LocalVisionAI
          7z a -tzip ..\LocalVisionAI-${{ needs.meta.outputs.tag }}-Windows.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/LocalVisionAI-*-Windows.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Linux
  # --------------------------------------------------------------------------
  build-linux:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer-plugins-base1.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build binary
        run: .venv/bin/pyinstaller app/desktop.spec --clean --noconfirm

      - name: Verify build
        run: test -d dist/LocalVisionAI/ || { echo "Build failed"; exit 1; }

      - name: Create tarball
        run: |
          cd dist && tar -czf "LocalVisionAI-${{ needs.meta.outputs.tag }}-Linux.tar.gz" LocalVisionAI/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/LocalVisionAI-*-Linux.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Create GitHub Release
  # --------------------------------------------------------------------------
  release:
    needs: [meta, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES_FILE="release_notes.md"

          # Try to extract changelog section with Python script
          if [ -f .github/scripts/extract_changelog.py ]; then
            python3 .github/scripts/extract_changelog.py "$VERSION" CHANGELOG.md > extracted.md
            if [ -s extracted.md ]; then
              echo "### Local Vision AI ${TAG}" > "$NOTES_FILE"
              echo "" >> "$NOTES_FILE"
              cat extracted.md >> "$NOTES_FILE"
            else
              echo "No CHANGELOG section found for ${VERSION}. Using fallback."
              echo "### Local Vision AI ${TAG}" > "$NOTES_FILE"
              echo "" >> "$NOTES_FILE"
              echo "Binaries built automatically via GitHub Actions." >> "$NOTES_FILE"
            fi
          else
            # Fallback: sed extraction
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > extracted.md || true
            if [ -s extracted.md ]; then
              cat extracted.md > "$NOTES_FILE"
            else
              echo "### Local Vision AI ${TAG}" > "$NOTES_FILE"
              echo "" >> "$NOTES_FILE"
              echo "Binaries built automatically via GitHub Actions." >> "$NOTES_FILE"
            fi
          fi

          echo "--- Release Notes ---"
          cat "$NOTES_FILE"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts
        run: |
          echo "Artifacts downloaded:"
          find artifacts -type f -ls
          echo ""
          echo "Sizes:"
          du -sh artifacts/*/* 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.release_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            artifacts/macos-release/*
            artifacts/windows-release/*
            artifacts/linux-release/*
