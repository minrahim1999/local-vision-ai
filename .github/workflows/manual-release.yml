name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.2.0 or 0.2.0)'
        required: true
        default: 'v0.2.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  # --------------------------------------------------------------------------
  # Metadata
  # --------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      release_name: ${{ steps.parse.outputs.release_name }}
    steps:
      - name: Parse version input
        id: parse
        run: |
          RAW="${{ github.event.inputs.version }}"
          # Strip leading 'v' if present, then re-add it for tag
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          RELEASE_NAME="Local Vision AI ${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "Parsed: TAG=${TAG}, VERSION=${VERSION}"

  # --------------------------------------------------------------------------
  # Create git tag (only if it doesn't exist)
  # --------------------------------------------------------------------------
  create-tag:
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or verify tag
        id: tag
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping creation."
            echo "created=false" >> $GITHUB_OUTPUT
          else
            echo "Creating annotated tag $TAG..."
            # Use latest commit on current branch
            COMMIT=$(git rev-parse HEAD)
            git tag -a "$TAG" "$COMMIT" -m "Release $TAG"
            git push origin "$TAG"
            echo "created=true" >> $GITHUB_OUTPUT
            echo "Created tag $TAG at $COMMIT"
          fi

  # --------------------------------------------------------------------------
  # macOS
  # --------------------------------------------------------------------------
  build-macos:
    needs: [meta, create-tag]
    runs-on: macos-14
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i '' "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build .app
        run: .venv/bin/pyinstaller app/desktop.spec --clean --noconfirm

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_staging
          cp -r dist/LocalVisionAI.app dist/dmg_staging/
          hdiutil create -volname "Local Vision AI" \
            -srcfolder dist/dmg_staging \
            -ov -format UDZO \
            "dist/LocalVisionAI-${{ needs.meta.outputs.tag }}-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/LocalVisionAI-*-macOS.dmg

  # --------------------------------------------------------------------------
  # Windows
  # --------------------------------------------------------------------------
  build-windows:
    needs: [meta, create-tag]
    runs-on: windows-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build EXE
        run: .venv\Scripts\pyinstaller app/desktop.spec --clean --noconfirm

      - name: Create ZIP
        run: |
          cd dist\LocalVisionAI
          7z a -tzip ..\LocalVisionAI-${{ needs.meta.outputs.tag }}-Windows.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/LocalVisionAI-*-Windows.zip

  # --------------------------------------------------------------------------
  # Linux
  # --------------------------------------------------------------------------
  build-linux:
    needs: [meta, create-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer-plugins-base1.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build binary
        run: .venv/bin/pyinstaller app/desktop.spec --clean --noconfirm

      - name: Create tarball
        run: |
          cd dist && tar -czf "LocalVisionAI-${{ needs.meta.outputs.tag }}-Linux.tar.gz" LocalVisionAI/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/LocalVisionAI-*-Linux.tar.gz

  # --------------------------------------------------------------------------
  # Create GitHub Release
  # --------------------------------------------------------------------------
  release:
    needs: [meta, create-tag, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          # Try to extract changelog section
          sed -n "/^## \[${TAG#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "### Release ${TAG}" > release_notes.md
            echo "" >> release_notes.md
            echo "Binaries built automatically via GitHub Actions." >> release_notes.md
          fi
          cat release_notes.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.release_name }}
          body_path: release_notes.md
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/macos-release/*
            artifacts/windows-release/*
            artifacts/linux-release/*
