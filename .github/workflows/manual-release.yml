name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.2.0 or 0.2.0)'
        required: true
        default: 'v0.2.0'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      create_tag:
        description: 'Create git tag if it does not exist'
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'

jobs:
  # --------------------------------------------------------------------------
  # Metadata
  # --------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      release_name: ${{ steps.parse.outputs.release_name }}
    steps:
      - name: Parse version input
        id: parse
        run: |
          RAW="${{ github.event.inputs.version }}"
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          RELEASE_NAME="Local Vision AI ${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "Parsed: TAG=${TAG}, VERSION=${VERSION}"

  # --------------------------------------------------------------------------
  # Create git tag (only if it doesn't exist)
  # --------------------------------------------------------------------------
  create-tag:
    needs: meta
    if: github.event.inputs.create_tag == 'true'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Create or verify tag
        id: tag
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping creation."
            echo "created=false" >> $GITHUB_OUTPUT
          else
            echo "Creating annotated tag $TAG..."
            COMMIT=$(git rev-parse HEAD)
            git tag -a "$TAG" "$COMMIT" -m "Release $TAG"
            git push origin "$TAG"
            echo "created=true" >> $GITHUB_OUTPUT
            echo "Created tag $TAG at $COMMIT"
          fi

  # --------------------------------------------------------------------------
  # macOS
  # --------------------------------------------------------------------------
  build-macos:
    needs: [meta, create-tag]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: macos-14
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i '' "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build .app
        run: .venv/bin/pyinstaller app/desktop.spec --clean --noconfirm

      - name: Verify build
        run: |
          test -d dist/LocalVisionAI.app || { echo "Build failed: no .app"; exit 1; }
          ls dist/LocalVisionAI.app/Contents/Resources/assets/icons/ || true

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_staging
          cp -r dist/LocalVisionAI.app dist/dmg_staging/
          hdiutil create -volname "Local Vision AI" \
            -srcfolder dist/dmg_staging \
            -ov -format UDZO \
            "dist/LocalVisionAI-${{ needs.meta.outputs.tag }}-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/LocalVisionAI-*-macOS.dmg
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows
  # --------------------------------------------------------------------------
  build-windows:
    needs: [meta, create-tag]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: windows-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build EXE
        run: .venv\Scripts\pyinstaller app/desktop.spec --clean --noconfirm

      - name: Verify build
        shell: bash
        run: test -d dist/LocalVisionAI/ || { echo "Build failed"; exit 1; }

      - name: Create ZIP
        run: |
          cd dist\LocalVisionAI
          7z a -tzip ..\LocalVisionAI-${{ needs.meta.outputs.tag }}-Windows.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/LocalVisionAI-*-Windows.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Linux
  # --------------------------------------------------------------------------
  build-linux:
    needs: [meta, create-tag]
    if: always() && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer-plugins-base1.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Setup Python
        run: uv venv --python ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,desktop]"
          uv pip install pyinstaller

      - name: Inject version
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i "s/Local Vision AI v.*/Local Vision AI v${VERSION}/g" app/desktop.py

      - name: Build binary
        run: .venv/bin/pyinstaller app/desktop.spec --clean --noconfirm

      - name: Verify build
        run: test -d dist/LocalVisionAI/ || { echo "Build failed"; exit 1; }

      - name: Create tarball
        run: |
          cd dist && tar -czf "LocalVisionAI-${{ needs.meta.outputs.tag }}-Linux.tar.gz" LocalVisionAI/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/LocalVisionAI-*-Linux.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Create GitHub Release
  # --------------------------------------------------------------------------
  release:
    needs: [meta, create-tag, build-macos, build-windows, build-linux]
    if: always() && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES_FILE="release_notes.md"

          # Try to extract changelog section with Python script
          if [ -f .github/scripts/extract_changelog.py ]; then
            python3 .github/scripts/extract_changelog.py "$VERSION" CHANGELOG.md > extracted.md
            if [ -s extracted.md ]; then
              echo "### Local Vision AI ${TAG}" > "$NOTES_FILE"
              echo "" >> "$NOTES_FILE"
              cat extracted.md >> "$NOTES_FILE"
            else
              echo "No CHANGELOG section found for ${VERSION}. Using fallback."
              echo "### Local Vision AI ${TAG}" > "$NOTES_FILE"
              echo "" >> "$NOTES_FILE"
              echo "Binaries built automatically via GitHub Actions." >> "$NOTES_FILE"
            fi
          else
            # Fallback: sed extraction
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > extracted.md || true
            if [ -s extracted.md ]; then
              cat extracted.md > "$NOTES_FILE"
            else
              echo "### Local Vision AI ${TAG}" > "$NOTES_FILE"
              echo "" >> "$NOTES_FILE"
              echo "Binaries built automatically via GitHub Actions." >> "$NOTES_FILE"
            fi
          fi

          echo "--- Release Notes ---"
          cat "$NOTES_FILE"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifacts
        run: |
          echo "Artifacts downloaded:"
          find artifacts -type f -ls
          echo ""
          echo "Sizes:"
          du -sh artifacts/*/* 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.release_name }}
          body_path: release_notes.md
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: false
          files: |
            artifacts/macos-release/*
            artifacts/windows-release/*
            artifacts/linux-release/*
