[project]
name = "local-vision-ai"
version = "0.2.0"
description = "Production-structured local multimodal AI — Text-to-Image and Image-to-Text on Apple Silicon, Windows, and Linux"
requires-python = ">=3.10"
authors = [{ name = "Muhaimin", email = "dev@example.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "vision", "multimodal", "image-generation", "vlm", "local-ml", "mlx", "flet", "desktop-app"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy<2.0",
]

[project.urls]
Homepage = "https://github.com/minrahim1999/local-vision-ai"
Repository = "https://github.com/minrahim1999/local-vision-ai"
Issues = "https://github.com/minrahim1999/local-vision-ai/issues"
Changelog = "https://github.com/minrahim1999/local-vision-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
text_to_image = [
    "diffusers>=0.29,<0.40",
    "transformers>=4.40,<4.58",
    "torch>=2.2",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "omegaconf>=2.3",
]

image_to_text = [
    "torch>=2.2",
    "transformers>=4.40,<4.58",
    "qwen-vl-utils>=0.0.6",
]

apple_silicon = [
    "mlx>=0.22",
    "mlx-vlm>=0.1",
]

desktop = [
    "flet>=0.80",
]

unsloth = [
    "unsloth>=2025.0.0",
    "trl>=0.9",
    "peft>=0.11",
    "datasets>=2.19",
    "sentencepiece>=0.2",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "click>=8.1",
]

[project.scripts]
lvai-api = "api.main:main"
lvai-cli = "app.cli:cli"
lvai-desktop = "app.desktop:main"
lvai-standalone = "app.standalone:main"
lvai-prepare-vlm = "training.image_to_text.prepare_dataset:main"
lvai-train-vlm = "training.image_to_text.train_lora:main"
lvai-eval-vlm = "training.image_to_text.evaluate:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "services*", "training*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
